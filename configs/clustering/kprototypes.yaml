name: 'kprototypes'
distance: ${distance}              # inherited from the top-level key
max_fit_samples: 20000              # standalone: no s×s co-association, safe to raise the fit budget
consensus_threshold: 0.5            # inert for a single algorithm
min_consensus_size: 1               # inert for a single algorithm
min_cluster_floor: 5               # guard against degenerate K in grid search; post-hoc absorption is near-zero
target_cluster_size: 25000         # clusters above this size are split into sub-clusters (post-hoc, full-data MiniBatchKMeans)
target_size_frac: 0.05             # adaptive: effective target = clamp(2*floor, total_n * frac, target_cluster_size)
algorithms:
  kprototypes:                       # mixed-type: k-means on numerics + matching dissimilarity on categoricals
    n_clusters: [4, 8, 16, 32, 64]
    gamma: [0.25, 0.5, 1.0, 2.0]     # weight of the categorical contribution (kmodes default ≈ 0.5 on scaled data)
